[accessibility]
ui_scale = 1.1000000089406967

[bar.default]
background_opacity = 0.0
border = "primary"
border_width = 0.0
capsule = true
capsule_fill = "surface"
capsule_opacity = 0.79999998211860657
capsule_padding = 8.0
capsule_thickness = 0.79999998584389687
center = [ "workspaces" ]
color = "primary"
concave_edge_corners = false
end = [ "cpu", "power_profile", "battery", "volume", "bluetooth", "network", "settings", "control-center", "session" ]
font_family = "AnnotationM NF ExtraBold"
font_scale = 1.0999999828636646
icon_color = "secondary"
margin_edge = 10
margin_ends = 10
padding = 15
radius = 24
scale = 1.1000000089406967
shadow = false
start = [ "clock", "date", "notifications" ]
thickness = 40
widget_spacing = 12

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
address = "Craiova, Romania"

[lockscreen]
transition = [ "zoom" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 768.0
    cy = 718.4000244140625
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true
force = true
temperature_day = 6000
temperature_night = 3800

[shell]
app_icon_color = "secondary"
app_icon_colorize = false
avatar_path = "/home/olvyyd/art/ProfilePictures/Olvyyd.png"
font_family = "AnnotationM NF ExtraBold"
screen_time_enabled = true
settings_window_translucent = true

[theme]
builtin = "Eldritch"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/olvyyd/wallpapers"
transition = [ "zoom" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/olvyyd/wallpapers/country.jpg"

    [wallpaper.last]
    path = "/home/olvyyd/wallpapers/country.jpg"

    [wallpaper.monitor.HDMI-A-1]
    fill_color = "primary"

    [wallpaper.monitor.eDP-1]
    fill_color = "secondary"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/olvyyd/wallpapers/country.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/olvyyd/wallpapers/country.jpg"

[widget.cpu]
glyph = "cpu"
stat = "cpu_temp"
visualization = "none"

[widget.media]
enabled = false

[widget.network]
show_label = false

[widget.ram]
glyph = "cpu-2"

[widget.workspaces]
empty_color = "primary"
occupied_color = "primary"
