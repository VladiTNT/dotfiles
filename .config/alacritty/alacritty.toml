# ======================= #
# Alacritty Configuration #
# ======================= #

# Window options
[window]
decorations = "None"
padding = { x = 15, y = 15 }
opacity = 0.9

# Font options
[font]
size = 14.0
normal = { family = "AnnotationM NF", style = "Bold" }

# Cursor options
[cursor]
style = { shape = "Underline", blinking = "Always" }
blink_interval = 500
blink_timeout = 0
unfocused_hollow = false
thickness = 0.20

# Clipboard
[selection]
save_to_clipboard = true

# Hide mouse
[mouse]
hide_when_typing = true

# Gruvbox Theme
[colors.primary]
background = '#1d2021'
foreground = '#d4be98'

[colors.normal]
black = '#32302f'
red = '#ea6962'
green = '#a9b665'
yellow = '#d8a657'
blue = '#7daea3'
magenta = '#d3869b'
cyan = '#89b482'
white = '#d4be98'

[colors.bright]
black = '#32302f'
red = '#ea6962'
green = '#a9b665'
yellow = '#d8a657'
blue = '#7daea3'
magenta = '#d3869b'
cyan = '#89b482'
white = '#d4be98'

[colors.cursor]
cursor = '#ec5d2a'
