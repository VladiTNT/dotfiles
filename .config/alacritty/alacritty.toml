# Alacritty Configuration

[window]
decorations = "None"
padding = { x = 15, y = 15 }
opacity = 0.9

[font]
size = 14.0
normal = { family = "AnnotationM NF", style = "Bold" }

[cursor]
style = { shape = "Underline", blinking = "Always" }
blink_interval = 500
blink_timeout = 0
unfocused_hollow = false
thickness = 0.20

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

# Dracula theme
[colors.primary]

background = "#282a36"
foreground = "#f8f8f2"
bright_foreground = "#ffffff"

[colors.cursor]

text = "#282a36"
cursor = "#f8f8f2"

[colors.vi_mode_cursor]

text = "CellBackground"
cursor = "CellForeground"

[colors.selection]

text = "CellForeground"
background = "#44475a"

[colors.normal]

black = "#21222c"
red = "#ff5555"
green = "#50fa7b"
yellow = "#f1fa8c"
blue = "#bd93f9"
